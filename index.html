<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 讓網頁在手機上符合螢幕寬度，並禁止縮放，讓它更像原生 App -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 允許加入手機主畫面後隱藏瀏覽器網址列 (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- 允許加入手機主畫面後隱藏瀏覽器網址列 (Android) -->
    <meta name="mobile-web-app-capable" content="yes">
    <title>21點追蹤器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dashboard {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 15px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
        }
        .profit {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }
        .profit.positive { color: #4caf50; }
        .profit.negative { color: #f44336; }
        .stats {
            display: flex;
            justify-content: space-around;
            color: #aaaaaa;
            font-size: 0.9em;
        }
        .input-group {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 1.5em;
            border-radius: 10px;
            border: none;
            background-color: #2c2c2c;
            color: white;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        button {
            padding: 20px 10px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .btn-win { background-color: #4caf50; }
        .btn-loss { background-color: #f44336; }
        .btn-push { background-color: #9e9e9e; }
        .btn-reset {
            background-color: transparent;
            color: #f44336;
            border: 1px solid #f44336;
            margin-top: 30px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div>淨利潤 (Net Profit)</div>
        <div id="netProfitDisplay" class="profit">0</div>
        <div class="stats">
            <span id="totalHandsDisplay">總手數: 0</span>
            <span id="winRateDisplay">勝率: 0%</span>
        </div>
    </div>

    <div class="input-group">
        <label for="betAmount" style="color: #aaaaaa; text-align: center;">本局下注金額</label>
        <input type="number" id="betAmount" inputmode="numeric" placeholder="例如: 100">
    </div>

    <div class="btn-group">
        <button class="btn-win" onclick="recordHand('win')">贏</button>
        <button class="btn-push" onclick="recordHand('push')">平手</button>
        <button class="btn-loss" onclick="recordHand('loss')">輸</button>
    </div>

    <button class="btn-reset" onclick="resetData()">清除所有紀錄</button>

    <script>
        // 初始化資料
        let data = JSON.parse(localStorage.getItem('bj_tracker_data')) || {
            netProfit: 0,
            totalHands: 0,
            wins: 0,
            losses: 0,
            pushes: 0
        };

        const betInput = document.getElementById('betAmount');

        // 更新畫面顯示
        function updateUI() {
            const profitEl = document.getElementById('netProfitDisplay');
            profitEl.innerText = (data.netProfit > 0 ? '+' : '') + data.netProfit;
            profitEl.className = 'profit ' + (data.netProfit > 0 ? 'positive' : (data.netProfit < 0 ? 'negative' : ''));
            
            document.getElementById('totalHandsDisplay').innerText = `總手數: ${data.totalHands}`;
            
            let winRate = 0;
            let resolvedHands = data.wins + data.losses; // 計算勝率通常排除平手
            if (resolvedHands > 0) {
                winRate = Math.round((data.wins / resolvedHands) * 100);
            }
            document.getElementById('winRateDisplay').innerText = `勝率: ${winRate}%`;
        }

        // 記錄結果
        function recordHand(outcome) {
            const bet = parseFloat(betInput.value);
            if (isNaN(bet) || bet <= 0) {
                alert("請輸入有效的下注金額！");
                return;
            }

            data.totalHands++;

            if (outcome === 'win') {
                data.netProfit += bet;
                data.wins++;
            } else if (outcome === 'loss') {
                data.netProfit -= bet;
                data.losses++;
            } else if (outcome === 'push') {
                data.pushes++;
            }

            // 存入手機瀏覽器的 LocalStorage
            localStorage.setItem('bj_tracker_data', JSON.stringify(data));
            updateUI();
        }

        // 清除紀錄
        function resetData() {
            if(confirm("確定要清除所有紀錄嗎？")) {
                data = { netProfit: 0, totalHands: 0, wins: 0, losses: 0, pushes: 0 };
                localStorage.removeItem('bj_tracker_data');
                updateUI();
            }
        }

        // 初始載入時更新一次畫面
        updateUI();
    </script>
</body>
</html>
